text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Wi-Fi IP Address"
      id: wifi_ip
    ssid:
      name: "Wi-Fi SSID"
      id: wifi_ssid
  - platform: template
    name: "Expected SSID"
    id: expected_ssid
    lambda: |-
      return id(secret_ssid_storage);



interval:
  - interval: 500ms
    then:
      - lambda: |-
          bool test_mode = id(btn_y).state && id(btn_b).state;
          id(alarm_flag) = false;
          // int ready = 0;

          for (int i = 0; i < 26; i++) {
            int mux_ch = i % 13;               // 0..12
            int adc_ch = (i < 13) ? 0 : 2;    // first 13 → ADC0, second 13 → ADC2

            id(mux).activate_pin(mux_ch);
            delay(10);  // allow settling

            float adc_v_raw = id(adc).read_data(adc_ch);
            float adc_v = adc_v_raw * id(cal_factor)[i];
            id(values)[i] = adc_v;


            float vmin = test_mode ? id(min_vals_test)[i] : id(min_vals)[i];
            float vmax = test_mode ? id(max_vals_test)[i] : id(max_vals)[i];

            if (adc_v < vmin || adc_v > vmax) {
              id(alarm_flag) = true;
              //id(blink) = true;
              }
          // ready++;
          }
          // id(values_ready_count) = ready;  // update the percent display

      - lambda: |-
          auto call = id(status_led).make_call(); // 1. Create the call object
          call.set_transition_length(500);
          if (id(alarm_flag)) {
            if (id(blink_flag)) {
              call.set_state(true);
              id(blink_flag) = false;
              call.set_rgb(0.3,0,0);
            } else {
              call.set_state(false);
              //call.set_rgb(0,0,0);
              id(blink_flag) = true;
            }
          } else {
            call.set_state(true);
            call.set_rgb(0,0.3,0);
          }
          call.perform();



font:
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 10
    bpp: 8  
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
    bpp: 8  
  - file: "gfonts://Roboto"
    id: font_big
    size: 14
    bpp: 8  

display:
  - platform: st7789v
    spi_id: spi_display
    id: pico_display
    model: "Custom"
    cs_pin: 17
    dc_pin: 16
    reset_pin: 21
    backlight_pin: 20
    width: 240
    height: 320
    rotation: 90
    offset_height: 0
    offset_width: 0
    eightbitcolor: true
    update_interval: 1000ms

    pages:

      - id: init_page
        lambda: |-
          // Full black background
          it.fill(Color(0,0,0));

          // Centered text
          const char* text = "DB EL Tester Initializing...";
          // Approximate centering (manually tuned for your fonts)
          it.print(40, 120, id(font_big), Color(255,255,255), text);

      - id: main_page
        lambda: |-
          it.fill(Color(0,0,0));

          // column divider
          it.line(160, 0, 160, 224, Color(255,255,255));

          // headers
          it.print(10, 2, id(font_big), Color(255,255,255), "DB Side A");
          it.print(170, 2, id(font_big), Color(255,255,255), "DB Side B");

          for (int i = 0; i < 13; i++) {
            int y = 22 + i * 16;

            // cell boxes
            it.rectangle(0, y-2, 160, 16, Color(255,255,255));
            it.rectangle(160, y-2, 160, 16, Color(255,255,255));

            Color vcol = id(alarm_flag) ? Color(255,0,0) : Color(0,255,0);

          // Left side
          it.printf(4, y, id(font_small), Color(255,255,0), "%s", id(channel_label)[i]);
          it.printf(60, y, id(font_small), vcol, "%.3f", id(values)[i]);

          // Right side
          it.printf(164, y, id(font_small), Color(255,255,0), "%s", id(channel_label)[i+13]);
          it.printf(220, y, id(font_small), vcol, "%.3f", id(values)[i+13]);
          }

          // Wi-Fi status at bottom
          if (id(wifi_ip).state != "") {
              // Connected: show SSID and IP
              char buf[50];
              snprintf(buf, sizeof(buf), "%s: %s", id(wifi_ssid).state.c_str(), id(wifi_ip).state.c_str());
              it.print(5, 228, id(font_tiny), Color(0,255,0), buf);
          } else {
              // Disconnected: show "Looking for 'SSID'"
              char buf[50];
              snprintf(buf, sizeof(buf), "Looking for %s", id(expected_ssid).state.c_str());
              it.print(5, 228, id(font_tiny), Color(255,0,0), buf);
          }          

      - id: halted_page
        lambda: |-
          it.fill(Color(0,0,0));
          it.print(
            20, 80,
            id(font_big),
            Color(255,255,255),
            "Firmware stopped\nand Pico reset!"
          );
